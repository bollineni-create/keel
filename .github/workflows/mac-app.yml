# Compiles Daybook.app on a Mac runner whenever the Mac app changes, so a broken build shows up on the PR
# instead of on someone's Mac. It builds only; nothing is installed or published.
name: Build Mac app

on:
  pull_request:
    paths:
      - 'app/macos/**'
      - '.github/workflows/mac-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Daybook.app (Intel + Apple silicon)
        run: ./app/macos/build.sh --no-install

      - name: Check the bundle
        run: |
          plutil -lint build/Daybook.app/Contents/Info.plist
          lipo -archs build/Daybook.app/Contents/MacOS/Daybook
          test -f build/Daybook.app/Contents/Resources/AppIcon.icns
          codesign --verify --verbose build/Daybook.app
